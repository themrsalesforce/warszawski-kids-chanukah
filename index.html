<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1f4b">
<meta name="robots" content="noindex,nofollow">
<title>Warszawski Kids Chanukah</title>
<meta property="og:title" content="Warszawski Kids Chanukah 🕎🎄">
<meta property="og:description" content="Who's sending to who, sent & received, and gift ideas. Tap your kid!">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🕎</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Grandstander:wght@700;800;900&display=swap" rel="stylesheet">
<style>
:root{--navy:#0b1f4b;--navy2:#132d66;--blue:#2f6fde;--sky:#8fc3ff;--silver:#e9eef7;--gold:#ffc93c;--red:#e5383b;--green:#1f9d55;--ink:#14213d;--muted:#5b6785;--card:#fff;--r:20px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{font-family:Fredoka,system-ui,sans-serif;color:var(--ink);background:var(--navy);min-height:100vh;overflow-x:hidden}
#snow{position:fixed;inset:0;pointer-events:none;z-index:0}
.wrap{position:relative;z-index:1;max-width:640px;margin:0 auto;padding:0 14px calc(90px + env(safe-area-inset-bottom))}
header.hero{color:#fff;text-align:center;padding:26px 6px 8px}
.hero h1{font-family:Grandstander,Fredoka,sans-serif;font-weight:900;font-size:clamp(30px,9vw,46px);line-height:.98;margin:8px 0 6px;letter-spacing:.5px;text-shadow:0 3px 0 #06122e}
.hero h1 .k{color:var(--gold)}
.hero h1 .c{text-shadow:none;filter:drop-shadow(0 3px 0 #06122e);background:linear-gradient(90deg,#8fc3ff,#fff 45%,#ff8a8a 70%,#7be3a4);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{margin:4px 0 0;color:#c9d8ff;font-size:15px}
.menorah{width:min(260px,70vw);height:auto;display:block;margin:0 auto}
.flame{transform-origin:50% 100%;animation:fl 1.4s ease-in-out infinite alternate}
.flame:nth-child(2n){animation-delay:.3s}.flame:nth-child(3n){animation-delay:.7s}
@keyframes fl{from{transform:scale(1,1)}to{transform:scale(.85,1.12)}}
.card{background:var(--card);border-radius:var(--r);padding:16px;margin:14px 0;box-shadow:0 8px 0 rgba(0,0,0,.18)}
.card h2{font-family:Grandstander,sans-serif;font-weight:800;font-size:21px;margin:0 0 10px;display:flex;align-items:center;gap:8px}
.progress .bar{height:16px;border-radius:99px;background:#e6ecf7;overflow:hidden;display:flex}
.progress .bar i{display:block;height:100%}
.progress .big{font-size:28px;font-weight:700}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;margin-top:10px;font-size:13px;color:var(--muted)}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;background:var(--c)}
.chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:10px}
.chip{border:0;background:#f3f6fc;border-radius:16px;padding:10px 4px 8px;text-align:center;font:inherit;cursor:pointer;color:var(--ink);transition:transform .12s}
.chip:active{transform:scale(.95)}
.chip .nm{font-weight:600;font-size:15px;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip .ag{font-size:12px;color:var(--muted)}
.av{width:46px;height:46px;border-radius:50%;display:inline-grid;place-items:center;font-weight:700;color:#fff;font-size:20px;position:relative;flex:none;box-shadow:inset 0 -4px 0 rgba(0,0,0,.15)}
.av small{position:absolute;right:-6px;bottom:-4px;font-size:17px}
.av.lg{width:92px;height:92px;font-size:40px}.av.lg small{font-size:30px;right:-8px}
.pair{display:flex;align-items:center;gap:10px;padding:12px 4px;border-bottom:1px dashed #dde3ef}
.pair:last-child{border-bottom:0}
.who{display:flex;align-items:center;gap:8px;min-width:0;flex:1;background:none;border:0;font:inherit;color:inherit;padding:0;text-align:left;cursor:pointer}
.who .av{width:38px;height:38px;font-size:16px}.who .av small{font-size:13px;right:-5px}
.who b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who em{font-style:normal;font-size:12px;color:var(--muted)}
.arrow{font-size:20px;flex:none}
.pill{border:0;border-radius:99px;padding:6px 10px;font:600 12px Fredoka,sans-serif;cursor:pointer;white-space:nowrap;flex:none;color:#fff}
.s-none{background:#a4afc6}.s-idea{background:#8b5cf6}.s-bought{background:var(--blue)}.s-wrapped{background:var(--red)}.s-delivered{background:var(--green)}
.seg{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.seg button{border:2px solid #e2e8f3;background:#fff;border-radius:14px;padding:9px 2px;font:600 12px Fredoka,sans-serif;cursor:pointer;color:var(--ink)}
.seg button .e{display:block;font-size:20px}
.seg button.on{color:#fff;border-color:transparent}
.btn{border:0;border-radius:14px;padding:12px 16px;font:600 15px Fredoka,sans-serif;cursor:pointer;background:var(--blue);color:#fff;box-shadow:0 4px 0 #1d4fa8}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 #1d4fa8}
.btn.red{background:var(--red);box-shadow:0 4px 0 #a5232a}.btn.green{background:var(--green);box-shadow:0 4px 0 #136b39}
.btn.ghost{background:#eef2fa;color:var(--ink);box-shadow:0 4px 0 #cfd8ea}
.btn.small{padding:8px 12px;font-size:13px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
label.f{display:block;font-size:13px;font-weight:600;color:var(--muted);margin:10px 0 4px}
input,select,textarea{width:100%;font:16px Fredoka,sans-serif;padding:11px 12px;border-radius:12px;border:2px solid #e2e8f3;background:#fbfcff;color:var(--ink)}
textarea{min-height:70px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--sky)}
.warn{background:#fff4d6;border:2px solid var(--gold);border-radius:16px;padding:12px 14px;margin:14px 0;font-size:14px}
.warn b{display:block;margin-bottom:4px}
.ok{background:#e5f7ec;border:2px solid #7bd3a0;border-radius:16px;padding:10px 14px;margin:14px 0;font-size:14px;color:#135e33}
.links{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.link{border:0;border-radius:18px;padding:14px 12px;text-align:left;font:inherit;cursor:pointer;color:#fff;min-height:96px;display:flex;flex-direction:column;justify-content:space-between}
.link.give{background:linear-gradient(135deg,#e5383b,#b81f3a)}.link.get{background:linear-gradient(135deg,#1f9d55,#0f6e3b)}
.link small{opacity:.85;font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.5px}
.link .who2{display:flex;align-items:center;gap:8px;margin-top:8px}
.link .who2 .av{width:40px;height:40px;font-size:17px;background:rgba(255,255,255,.25)!important}
.link .who2 b{font-size:19px;display:block}.link .who2 em{font-style:normal;font-size:13px;opacity:.9}
.prof{text-align:center;color:#fff;padding:18px 0 4px}
.prof h1{font-family:Grandstander,sans-serif;font-weight:900;font-size:40px;margin:10px 0 0}
.prof .age{color:#c9d8ff;font-size:17px}
.back{padding-right:56px!important;position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;align-items:center;padding:10px 0;background:linear-gradient(var(--navy) 70%,transparent)}
.back button{border:0;background:rgba(255,255,255,.14);color:#fff;font:600 15px Fredoka,sans-serif;padding:9px 14px;border-radius:99px;cursor:pointer}
.ideas{display:grid;gap:10px}
.idea{display:flex;gap:12px;background:#f6f8fd;border-radius:16px;padding:10px;align-items:flex-start}
.idea img,.idea .ph{width:72px;height:72px;border-radius:12px;object-fit:cover;flex:none;background:#e6ecf7;display:grid;place-items:center;font-size:30px}
.idea .t{font-weight:600}.idea .p{color:var(--green);font-weight:700}
.idea .w{font-size:13px;color:var(--muted);margin-top:2px}
.idea a.buy{display:inline-block;margin-top:6px;background:#ffc93c;color:#2b1300;font-size:13px;font-weight:700;padding:6px 12px;border-radius:99px;text-decoration:none;box-shadow:0 3px 0 #d39b00}
.idea img{background:#fff;object-fit:contain;padding:4px;border:1px solid #e6ecf7}
.idea .x{margin-left:auto;border:0;background:none;color:#a4afc6;font-size:18px;cursor:pointer}
.empty{border:2px dashed #cdd6ea;border-radius:16px;padding:18px;text-align:center;color:var(--muted);font-size:14px}
.empty .big{font-size:34px}
details.add{margin-top:12px}
details.add summary{cursor:pointer;font-weight:600;color:var(--blue);list-style:none}
details.add summary::-webkit-details-marker{display:none}
.log{font-size:14px;max-height:340px;overflow:auto}
.log div{padding:7px 0;border-bottom:1px solid #eef1f7}
.log time{color:var(--muted);font-size:12px;display:block}
.excl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;background:#f6f8fd;border-radius:14px;padding:8px 10px;margin:6px 0}
.tag{background:#fff;border-radius:99px;padding:4px 10px;font-size:13px;font-weight:600;border:1px solid #e2e8f3}
.checks{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:6px;margin:8px 0}
.checks label{display:flex;gap:6px;align-items:center;font-size:14px;background:#f6f8fd;border-radius:10px;padding:6px 8px}
.checks input{width:auto}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:10;display:flex;justify-content:center;gap:6px;padding:8px 10px calc(8px + env(safe-area-inset-bottom));background:rgba(11,31,75,.92);backdrop-filter:blur(8px)}
.nav button{flex:1;max-width:150px;border:0;background:none;color:#c9d8ff;font:600 12px Fredoka,sans-serif;padding:4px;border-radius:12px;cursor:pointer}
.nav button .e{display:block;font-size:22px}
.nav button.on{background:rgba(255,255,255,.12);color:#fff}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);opacity:0;background:#fff;color:var(--ink);padding:10px 16px;border-radius:99px;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.3);transition:.25s;z-index:20;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.sync{font-size:12px;color:#9fb3e6;text-align:center;margin-top:6px}
.sync i{display:inline-block;width:8px;height:8px;border-radius:50%;background:#3ddc84;margin-right:5px}
.sync.off i{background:var(--gold)}
.muted{color:var(--muted);font-size:13px}
.foot{color:#9fb3e6;text-align:center;font-size:12px;margin:20px 0}
.tg{border:2px solid #e2e8f3;background:#fff;border-radius:99px;padding:6px 10px;font:600 12px Fredoka,sans-serif;cursor:pointer;color:var(--muted);white-space:nowrap}
.tg.on.s{background:var(--green);border-color:var(--green);color:#fff}.tg.on.r{background:var(--blue);border-color:var(--blue);color:#fff}
.toggles{display:flex;gap:6px;justify-content:flex-end;margin-top:8px}
.pair{flex-wrap:wrap}.pair .toggles{width:100%}
.bigtg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.bigtg button{border:2px solid #e2e8f3;background:#fff;border-radius:16px;padding:12px 8px;font:600 14px Fredoka,sans-serif;cursor:pointer;color:var(--ink);text-align:center}
.bigtg button .e{display:block;font-size:26px;filter:grayscale(1);opacity:.5}
.bigtg button.on .e{filter:none;opacity:1}
.bigtg button.on.s{background:#e5f7ec;border-color:var(--green);color:#135e33}.bigtg button.on.r{background:#e6efff;border-color:var(--blue);color:#1d4fa8}
.bigtg button small{display:block;font-weight:500;color:var(--muted);font-size:12px;margin-top:2px}
.st{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.st span{background:rgba(255,255,255,.22);border-radius:99px;padding:3px 8px;font-size:12px;font-weight:600}
.open{border-radius:var(--r);padding:16px;margin:14px 0;color:#fff;background:linear-gradient(135deg,#e5383b 0%,#b81f3a 45%,#1f9d55 100%);box-shadow:0 8px 0 rgba(0,0,0,.18);text-align:center;position:relative;overflow:hidden}
.open.go{background:linear-gradient(135deg,#ffc93c,#ff8a3c 50%,#e5383b);color:#2b1300;animation:pulse 1.6s ease-in-out infinite alternate}
@keyframes pulse{to{transform:scale(1.015)}}
.open .t1{font-family:Grandstander,sans-serif;font-weight:900;font-size:22px}
.open .t2{font-size:16px;margin-top:4px}.open .n{font-family:Grandstander,sans-serif;font-weight:900;font-size:44px;line-height:1;margin:8px 0 2px}
.open button.ch{margin-top:10px;border:0;background:rgba(255,255,255,.22);color:inherit;font:600 13px Fredoka,sans-serif;padding:7px 14px;border-radius:99px;cursor:pointer}
.open .ed{display:none;gap:8px;margin-top:10px;justify-content:center}.open.editing .ed{display:flex}
.open .ed input{max-width:180px;padding:8px}
.gear{position:fixed;top:calc(10px + env(safe-area-inset-top));right:12px;z-index:12;width:42px;height:42px;border-radius:50%;border:0;background:rgba(255,255,255,.14);color:#fff;font-size:20px;cursor:pointer;backdrop-filter:blur(6px)}
.drawcard{background:linear-gradient(160deg,#fff 0%,#eef4ff 100%)}
.drawcard .chips .chip{background:#fff;border:2px dashed #b9c8ea}
.drawcard .chip.done{opacity:.45;border-style:solid}
.bigbtn{display:block;width:100%;font-size:20px;padding:16px;border-radius:18px}
.wheelbox{position:relative;width:min(340px,88vw);margin:6px auto 0}
.wheelbox svg{width:100%;height:auto;display:block;filter:drop-shadow(0 10px 0 rgba(0,0,0,.25))}
.pointer{position:absolute;left:50%;top:-14px;transform:translateX(-50%);font-size:40px;z-index:2;filter:drop-shadow(0 3px 0 rgba(0,0,0,.3))}
.hub{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:22%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff3c4,#ffc93c 55%,#d39b00);display:grid;place-items:center;font-size:clamp(22px,7vw,34px);box-shadow:0 4px 0 #a67700}
.drawhead{color:#fff;text-align:center;padding:8px 0 4px}
.drawhead h1{font-family:Grandstander,sans-serif;font-weight:900;font-size:30px;margin:6px 0 0}
.drawhead p{color:#c9d8ff;margin:4px 0 0}
.status-line{color:#fff;text-align:center;font-family:Grandstander,sans-serif;font-weight:800;font-size:22px;min-height:32px;margin:14px 0 6px}
.reveal{text-align:center;animation:pop .6s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{from{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:1}}
.reveal .av.lg{width:110px;height:110px;font-size:48px}
.reveal h2{justify-content:center;font-size:30px!important}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:30}
.sheet input.code{font-size:28px;letter-spacing:10px;text-align:center}
.biggive{width:100%;margin-top:14px;min-height:120px}.biggive .who2 b{font-size:26px}.biggive .who2 .av{width:54px;height:54px;font-size:22px}
.getsline{color:#dfe8ff;text-align:center;font-size:15px;margin:10px 0 0;font-weight:500}.getsline a{color:#ffc93c;font-weight:700;text-decoration:none}
.pin{color:#fff;text-align:center;padding:10px 0 20px}.lockic{font-size:30px}.pin .pt{font-size:22px;font-weight:500;margin-top:8px}.pin .ps{font-size:14px;color:#9fb3e6;margin-top:2px}
.dots{display:flex;gap:22px;justify-content:center;margin:26px 0 34px}.dots i{width:14px;height:14px;border-radius:50%;border:1.5px solid #fff;transition:background .1s}.dots i.on{background:#fff}
.dots.shake{animation:shake .45s cubic-bezier(.36,.07,.19,.97)}@keyframes shake{10%,90%{transform:translateX(-2px)}20%,80%{transform:translateX(5px)}30%,50%,70%{transform:translateX(-12px)}40%,60%{transform:translateX(12px)}}
.pad{display:grid;grid-template-columns:repeat(3,78px);gap:16px 26px;justify-content:center}
.pad button{width:78px;height:78px;border-radius:50%;border:0;background:rgba(255,255,255,.16);color:#fff;font-family:Fredoka,-apple-system,sans-serif;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:background .15s}
.pad button:active{background:rgba(255,255,255,.45)}.pad button b{font-size:34px;font-weight:400;line-height:1}.pad button small{font-size:9px;letter-spacing:2px;font-weight:700;margin-top:2px;min-height:10px}
.pad button.del{background:none;font-size:26px}
.adminbar{display:flex;justify-content:space-between;align-items:center;margin:4px 0}.badge{background:var(--gold);color:#2b1300;font-weight:700;border-radius:99px;padding:6px 12px;font-size:14px}
details.kidrow{border-bottom:1px dashed #dde3ef;padding:8px 0}details.kidrow summary{display:flex;align-items:center;gap:10px;cursor:pointer;list-style:none}details.kidrow summary::-webkit-details-marker{display:none}
details.kidrow summary .av{width:34px;height:34px;font-size:15px}details.kidrow summary .av small{font-size:12px}
.qbox{background:#f3f6fc;border-radius:16px;padding:10px 12px}.qh{font-weight:700;font-size:14px;margin-bottom:6px}
.qlist{list-style:none;margin:0;padding:0;display:grid;gap:6px}.qlist li{display:flex;align-items:center;gap:8px;background:#fff;border-radius:12px;padding:6px 8px;font-size:15px;animation:pop .4s}
.qlist li.me{outline:2px solid var(--gold)}.qlist .qn{font-family:Grandstander,sans-serif;font-weight:900;color:var(--red);width:22px;text-align:center}.qlist .av{width:30px;height:30px;font-size:13px}.qlist .av small{font-size:11px}
.qlist em{font-style:normal;font-size:11px;font-weight:700;background:var(--gold);border-radius:99px;padding:2px 8px;margin-left:auto}.qlist em.nx{background:var(--red);color:#fff}.qempty{color:var(--muted);font-size:14px}
.chip.inq{border:2px solid var(--gold)!important;background:#fff8e1!important}
#splash{position:fixed;inset:0;z-index:40;background:radial-gradient(ellipse at 50% 20%,#1d3f8f 0%,#0b1f4b 55%,#06122e 100%);color:#fff;overflow:auto;-webkit-overflow-scrolling:touch;transition:opacity .6s,transform .6s}
#splash.out{opacity:0;transform:scale(1.25)}
.sp{min-height:100%;display:flex;align-items:center;justify-content:center;padding:28px 16px calc(28px + env(safe-area-inset-bottom));position:relative}
.spin{position:relative;z-index:1;text-align:center;max-width:460px;width:100%}
.spin .menorah{width:min(200px,55vw);animation:glow 2s ease-in-out infinite alternate}@keyframes glow{to{filter:drop-shadow(0 0 18px rgba(255,201,60,.7))}}
.gr{font-family:Grandstander,sans-serif;font-weight:900;font-size:clamp(30px,9vw,44px);color:var(--gold);margin-top:6px;text-shadow:0 3px 0 #06122e}
.tl{font-size:17px;color:#c9d8ff;margin-top:4px}
.cd{font-family:Grandstander,sans-serif;font-weight:900;font-size:clamp(56px,20vw,96px);line-height:1;margin:14px 0 6px;background:linear-gradient(180deg,#fff,#8fc3ff);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 4px 0 #06122e);animation:beat 1s ease-in-out infinite;font-variant-numeric:tabular-nums}
.cd.go{background:linear-gradient(90deg,#ffc93c,#ff8a8a,#7be3a4);-webkit-background-clip:text;background-clip:text;animation:pop .6s cubic-bezier(.2,1.6,.4,1)}
@keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}
.at{display:inline-block;background:rgba(255,255,255,.14);border-radius:99px;padding:6px 14px;font-weight:600;font-size:15px}
.spq,.spj{background:rgba(255,255,255,.95);color:var(--ink);border-radius:18px;padding:12px;margin-top:16px;text-align:left}
.mini{display:flex;flex-wrap:wrap;gap:6px}.mini button{border:0;background:#eef2fa;border-radius:99px;padding:8px 12px;font:600 14px Fredoka,sans-serif;color:var(--ink);cursor:pointer}.mini button:active{background:var(--gold)}
.peek{margin-top:16px;border:0;background:none;color:#c9d8ff;font:600 15px Fredoka,sans-serif;text-decoration:underline;cursor:pointer}
.spk{position:fixed;inset:0;pointer-events:none;overflow:hidden}.spk span{position:absolute;top:-40px;font-size:24px;animation:fall linear infinite;opacity:.85}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg)}}
#show{position:fixed;inset:0;z-index:45;background:rgba(6,18,46,.97);overflow:auto;padding:20px 14px}.showin{max-width:460px;margin:0 auto}
.live{display:inline-block;background:var(--red);color:#fff;font-weight:700;border-radius:99px;padding:4px 12px;font-size:13px;animation:beat 1s infinite;margin-left:50%;transform:translateX(-50%)}
.filter{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:6px}
.filter button{border:0;border-radius:99px;padding:6px 12px;font:600 13px Fredoka,sans-serif;background:#eef2fa;color:var(--ink);white-space:nowrap;cursor:pointer}
.filter button.on{background:var(--navy);color:#fff}
</style>
</head>
<body>
<canvas id="snow"></canvas>
<div class="wrap" id="app"><div class="hero" style="color:#fff;text-align:center;padding-top:80px">Lighting the candles… 🕎</div></div>
<button class="gear" onclick="go('settings')" aria-label="Settings">⚙️</button>
<div id="splash" hidden></div>
<div id="show" hidden></div>
<canvas id="confetti"></canvas>
<nav class="nav" id="nav"></nav>
<div class="toast" id="toast"></div>
<script src="draw.js"></script>
<script>
const DATA_URL='https://textdb.dev/api/data/wkc-847f82d92bbd410787b5a9eaea59feac';
const BACKUP_URL='backup/state.json';
function migrate(st){if(!st)return st;st.kids.forEach(k=>{if('status' in k)delete k.status;k.sent=!!k.sent;k.received=!!k.received;k.giftIdeas=k.giftIdeas||[]});if(!('openingDate' in st))st.openingDate='';st.queue=st.queue||[];if(!('spinsOpenAt' in st))st.spinsOpenAt='';st.schema=2;return st}
function fmtDate(s){if(!s)return'';const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d).toLocaleDateString([], {weekday:'long',month:'long',day:'numeric'})}
function daysTo(s){if(!s)return null;const [y,m,d]=s.split('-').map(Number);const t=new Date();const a=new Date(t.getFullYear(),t.getMonth(),t.getDate());return Math.round((new Date(y,m-1,d)-a)/864e5)}
function fmtPrice(p){if(p===''||p==null)return'';const n=parseFloat(String(p).replace(/[^0-9.]/g,''));return isNaN(n)?String(p):'$'+n.toFixed(2)}
const COLORS=['#e5383b','#2f6fde','#1f9d55','#f59e0b','#8b5cf6','#0ea5b7','#d946ef','#ef6c3b','#3b82f6','#16a34a','#c2410c','#7c3aed'];
const BADGES=['🕎','🎄','⛄','🎁','🍩','⭐','🦌','🧦','🔵','❄️','🍪','🕯️','🎅','🪙','🔔','🥔','🎈'];
let S=null, readOnly=false, lastSync=null, busy=false, pending=[];
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const me=()=>localStorage.getItem('wkc-name')||'';
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('show'),m.length>40?4200:2200)}
function kid(id){return S.kids.find(k=>k.id===id)}
function kidIdx(id){return S.kids.findIndex(k=>k.id===id)}
function ageTxt(k){const a=String(k.age||'').trim();if(!a)return'';return /[a-z]/i.test(a)?a.replace(/\bmo\b/,'months'):(a==='1'?'1 year':a+' years')}
function hashStr(s){let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))|0;return Math.abs(h)}
function av(k,cls=''){if(!k)return`<span class="av ${cls}" style="background:#cbd3e3">?</span>`;const h=hashStr(k.id);return`<span class="av ${cls}" style="background:${COLORS[h%COLORS.length]}">${esc((k.name||'?')[0].toUpperCase())}<small>${BADGES[h%BADGES.length]}</small></span>`}
function giverOf(id){return Object.keys(S.assign).filter(g=>S.assign[g]===id)}
function excluded(a,b){return a===b||S.exclusions.some(g=>g.includes(a)&&g.includes(b))}
function problems(st=S){const out=[];const ids=st.kids.map(k=>k.id);const name=id=>(st.kids.find(k=>k.id===id)||{name:id}).name;
 for(const id of ids){const r=st.assign[id];if(!r)continue;if(!ids.includes(r))out.push(`${name(id)} is buying for someone who left`);else if(r===id)out.push(`${name(id)} is buying for themself`);else if(st.exclusions.some(g=>g.includes(id)&&g.includes(r)))out.push(`${name(id)} → ${name(r)} breaks a sibling rule`)}
 for(const id of ids){const n=ids.filter(g=>st.assign[g]===id).length;if(n>1)out.push(`${name(id)} is getting ${n} gifts`)}
 if(!out.length&&Draw.undrawn(st).length&&!Draw.feasible(st))out.push('The kids still to draw can\'t all get a valid name. Try a swap, or reset the draws in ⚙️ settings.');
 return out}
// ---------- storage ----------
async function fetchRemote(){const r=await fetch(DATA_URL+'?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);const t=(await r.text()).trim();if(!t)return null;const j=JSON.parse(t);if(!j||j.app!=='wkc')throw new Error('bad data');return migrate(j)}
async function pushRemote(st){const r=await fetch(DATA_URL,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(st)});if(!r.ok)throw new Error('HTTP '+r.status)}
async function load(){try{let j=await fetchRemote();if(!j){try{j=await (await fetch(BACKUP_URL+'?t='+Date.now(),{cache:'no-store'})).json();if(!j||j.app!=='wkc')throw 0}catch(_){j=await (await fetch('seed.json',{cache:'no-store'})).json()}await pushRemote(j)}S=migrate(j);readOnly=false;lastSync=new Date()}catch(e){console.warn(e);try{S=await (await fetch(BACKUP_URL+'?t='+Date.now(),{cache:'no-store'})).json();readOnly=true}catch(e2){S=await (await fetch('seed.json')).json();readOnly=true}migrate(S)}const ls=S.lastShow;seenShow=ls&&Date.now()-ls.at>30000?ls.at:null;render();checkShow();updateSplash(true)}
async function mutate(fn,msg){if(readOnly){toast('Offline right now, try again in a minute');return}
 pending.push({fn,msg});if(busy)return;busy=true;
 try{while(pending.length){const batch=pending.splice(0);let cur;try{cur=await fetchRemote()||S}catch(e){cur=S}
  for(const p of batch){p.fn(cur);if(p.msg){cur.log=cur.log||[];cur.log.unshift({t:new Date().toISOString(),who:me()||'Someone',msg:p.msg});cur.log=cur.log.slice(0,120)}}
  cur.rev=(cur.rev||0)+1;cur.updatedAt=new Date().toISOString();S=cur;render();await pushRemote(cur);lastSync=new Date()}
  toast('Saved ✓ everyone can see it')}catch(e){console.error(e);toast('Could not save, check your connection')}finally{busy=false;renderSync()}}
async function poll(){if(document.hidden||busy||readOnly&&!S)return;try{const j=await fetchRemote();lastSync=new Date();if(readOnly){readOnly=false}
 if(j&&(j.rev!==S.rev||j.updatedAt!==S.updatedAt)){S=j;checkShow();updateSplash(true);if(showing)return;const a=document.activeElement;if(a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName)){window._dirty=true}else render()}else renderSync()}catch(e){}}
setInterval(poll,5000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)poll()});
document.addEventListener('focusout',()=>setTimeout(()=>{if(window._dirty&&!/INPUT|TEXTAREA|SELECT/.test((document.activeElement||{}).tagName||'')){window._dirty=false;render()}},300));
// ---------- draw ----------
function shuffle(a){a=a.slice();const r=new Uint32Array(a.length);crypto.getRandomValues(r);for(let i=a.length-1;i>0;i--){const j=r[i]%(i+1);[a[i],a[j]]=[a[j],a[i]]}return a}
function makeDraw(){const ids=S.kids.map(k=>k.id);if(ids.length<2)return null;
 for(let t=0;t<20000;t++){const o=shuffle(ids);let ok=true;for(let i=0;i<o.length;i++)if(excluded(o[i],o[(i+1)%o.length])){ok=false;break}if(ok){const a={};o.forEach((g,i)=>a[g]=o[(i+1)%o.length]);return a}}
 // fallback: any valid derangement via backtracking
 const order=shuffle(ids),used=new Set(),a={};function bt(i){if(i===order.length)return true;for(const r of shuffle(ids)){if(used.has(r)||excluded(order[i],r))continue;used.add(r);a[order[i]]=r;if(bt(i+1))return true;used.delete(r)}return false}
 return bt(0)?a:null}
// ---------- views ----------
function route(){const h=location.hash.replace(/^#\/?/,'');const [v,id]=h.split('/');return{v:v||'home',id:decodeURIComponent(id||'')}}
function go(h){location.hash=h;window.scrollTo(0,0)}
window.addEventListener('hashchange',()=>{render();window.scrollTo(0,0)});
const menorah=`<svg class="menorah" viewBox="0 0 260 120" aria-hidden="true"><g fill="#ffc93c">${[0,1,2,3,4,5,6,7,8].map(i=>{const x=18+i*28,y=i===4?14:30;return`<rect x="${x-4}" y="${y+12}" width="8" height="${i===4?32:16}" rx="2" fill="${i%2?'#8fc3ff':'#fff'}"/><path class="flame" d="M${x} ${y-4} C${x+6} ${y+4} ${x+4} ${y+12} ${x} ${y+12} C${x-4} ${y+12} ${x-6} ${y+4} ${x} ${y-4}Z" fill="#ffb703"/>`}).join('')}</g><path d="M18 58 Q130 120 242 58 M46 58 Q130 105 214 58 M74 58 Q130 92 186 58 M102 58 Q130 78 158 58" stroke="#ffc93c" stroke-width="6" fill="none" stroke-linecap="round"/><rect x="126" y="58" width="8" height="46" fill="#ffc93c"/><rect x="98" y="102" width="64" height="12" rx="6" fill="#ffc93c"/></svg>`;
function toggles(k){return`<div class="toggles"><button class="tg s ${k.sent?'on':''}" data-sent="${esc(k.id)}">${k.sent?'✅ Sent':'◻️ Sent?'}</button><button class="tg r ${k.received?'on':''}" data-recv="${esc(k.id)}">${k.received?'📦 Received':'◻️ Received?'}</button></div>`}
function openBanner(){const d=S.openingDate,n=daysTo(d);const isGo=d&&n<=0;
 return`<div class="open ${isGo?'go':''}" id="openb">${isGo?`<div class="t1">🎉 Time to open! 🎁</div><div class="t2">Opening day ${n===0?'is today':'was '+esc(fmtDate(d))}! Rip into those boxes 🕎🎄</div>`:`<div class="t1">Keep boxes closed! 🎁</div><div class="t2">Opening day: <b>${d?esc(fmtDate(d)):'Date TBD'}</b></div>${d?`<div class="n">${n}</div><div class="t2">${n===1?'day':'days'} to go</div>`:''}`}
 </div>`}
function renderSync(){const el=$('#sync');if(!el)return;el.className='sync'+(readOnly?' off':'');el.innerHTML=readOnly?'<i></i>Showing the last saved copy, live sync is reconnecting…':`<i></i>Live: everyone sees changes${lastSync?' · synced '+lastSync.toLocaleTimeString([], {hour:'numeric',minute:'2-digit'}):''}`}
function nav(){const v=route().v;$('#nav').innerHTML=[['home','🕎','Home'],['list','🎁','All gifts']].concat(isAdmin()?[['log','📜','Activity']]:[]).map(([k,e,l])=>`<button class="${v===k?'on':''}" onclick="go('${k==='home'?'':k}')"><span class="e">${e}</span>${l}</button>`).join('')}
function progressCard(){const n=S.kids.length,s=S.kids.filter(k=>k.sent).length,r=S.kids.filter(k=>k.received).length;
 return`<div class="card progress"><h2>📮 Gift progress</h2><div class="big" style="font-size:22px">✅ ${s} of ${n} sent · 📦 ${r} of ${n} received</div>
 <div class="muted" style="margin:8px 0 4px">Sent</div><div class="bar"><i style="width:${n?s/n*100:0}%;background:var(--green)"></i></div>
 <div class="muted" style="margin:8px 0 4px">Received</div><div class="bar"><i style="width:${n?r/n*100:0}%;background:var(--blue)"></i></div></div>`}
function warnBox(){const p=problems();return p.length?`<div class="warn"><b>⚠️ Heads up, the draw needs fixing</b>${p.map(esc).join('<br>')}${isAdmin()?`<div style="margin-top:8px"><button class="btn small" onclick="go('settings')">Fix it</button></div>`:''}</div>`:''}
function pairRow(k){const r=kid(S.assign[k.id]);return`<div class="pair"><button class="who" onclick="go('kid/${esc(k.id)}')">${av(k)}<span style="min-width:0"><b>${esc(k.name)}</b><em>${esc(ageTxt(k))}</em></span></button><span class="arrow">🎁➜</span>${r?`<button class="who" onclick="go('kid/${esc(r.id)}')">${av(r)}<span style="min-width:0"><b>${esc(r.name)}</b><em>${esc(ageTxt(r))}</em></span></button>`:`<button class="btn small" style="flex:1" onclick="go('draw/${esc(k.id)}')">🎡 Draw!</button>`}${r?toggles(k):''}</div>`}
function viewHome(){return`<header class="hero">${menorah}<h1><span class="k">Warszawski Kids</span><br><span class="c">Chanukah</span></h1><p>🕎 One gift each · everyone gets one 🎄</p><div id="sync" class="sync"></div></header>
 ${openBanner()}
 ${!me()?`<div class="card"><h2>👋 Who's here?</h2><p class="muted" style="margin:0 0 8px">Optional: your name shows next to your changes in the activity list.</p><div class="row" style="flex-wrap:nowrap"><input id="myname" placeholder="e.g. Aunt Shoshy"><button class="btn" onclick="setName()">Save</button></div></div>`:''}
 ${warnBox()}
 ${drawCard()}
 <div class="card"><h2>👆 Tap a kid</h2><p class="muted" style="margin:-4px 0 12px">See who they give to, who they get from, and gift ideas.</p><div class="chips">${S.kids.map(k=>`<button class="chip" onclick="go('kid/${esc(k.id)}')">${av(k)}<div class="nm">${esc(k.name)}</div><div class="ag">${esc(ageTxt(k))}</div></button>`).join('')}</div></div>
 ${progressCard()}
 <div class="card"><h2>🎁 Who buys for who</h2><p class="muted" style="margin:-4px 0 4px">Giver's family taps ✅ Sent when it's mailed. Receiver's family taps 📦 Received when it arrives.</p>${S.kids.map(pairRow).join('')}</div>
 <div class="foot">Made with ❤️ for the Warszawski kids · Chag Sameach & Happy Holidays<br>${me()?`Editing as ${esc(me())} · <a href="#" style="color:#c9d8ff" onclick="localStorage.removeItem('wkc-name');render();return false">change</a>`:''}</div>`}
let listFilter='all';
function viewList(){const F={all:()=>1,notsent:k=>!k.sent,sent:k=>k.sent,notrecv:k=>k.sent&&!k.received,recv:k=>k.received};const ks=S.kids.filter(F[listFilter]||F.all);return`<header class="hero"><h1 style="font-size:34px"><span class="c">All gifts</span></h1><div id="sync" class="sync"></div></header>${openBanner()}${progressCard()}<div class="card"><div class="filter">${[['all','All'],['notsent','⏳ Not sent'],['sent','✅ Sent'],['notrecv','🚚 On the way'],['recv','📦 Received']].map(([k,l])=>`<button class="${listFilter===k?'on':''}" onclick="listFilter='${k}';render()">${l}</button>`).join('')}</div>${ks.length?ks.map(pairRow).join(''):'<div class="empty">Nothing here yet</div>'}</div>`}
function ideaHTML(k,d,i){return`<div class="idea">${d.image?`<img src="${esc(d.image)}" alt="" loading="lazy" onerror="this.outerHTML='<div class=ph>🎁</div>'">`:'<div class="ph">🎁</div>'}<div style="min-width:0;flex:1"><div class="t">${esc(d.title)}</div>${d.price!==''&&d.price!=null?`<div class="p">${esc(fmtPrice(d.price))}</div>`:''}${d.why?`<div class="w">${esc(d.why)}</div>`:''}${d.url&&/^https?:\/\//.test(d.url)?`<a href="${esc(d.url)}" target="_blank" rel="noopener" class="buy">${/amazon\./.test(d.url)?'🛒 Buy on Amazon':'🛒 View / buy'} ↗</a>`:''}${d.addedBy||d.by?`<div class="w" style="font-size:11px">${/^From family$/i.test(d.addedBy||'')?'From family 💙':'Added by '+esc(d.addedBy||d.by)}</div>`:''}</div>${isAdmin()?`<button class="x" title="Remove" onclick="delIdea('${esc(k.id)}',${i})">✕</button>`:''}</div>`}
function viewKid(id){const k=kid(id);if(!k)return`<div class="back"><button onclick="go('')">← Home</button></div><div class="card">That kid isn't in the list anymore.</div>`;
 const r=kid(S.assign[k.id]);const gs=giverOf(k.id).map(kid).filter(Boolean);const g=gs[0];
 const ideas=(k.giftIdeas||[]);
 return`<div class="back"><button onclick="history.length>1?history.back():go('')">← Back</button><button onclick="go('')">🕎 Home</button></div>
 <div class="prof">${av(k,'lg')}<h1>${esc(k.name)}</h1><div class="age">${esc(ageTxt(k))}${/mo/i.test(k.age||'')?' · Mom & Dad shop for '+esc(k.name):''}</div></div>
 <button class="link give biggive" onclick="go('${r?'kid/'+esc(r.id):'draw/'+esc(k.id)}')"><small>🎁 ${esc(k.name)} is giving to</small><span class="who2">${av(r)}<span><b>${r?esc(r.name):'🎡 Draw!'}</b><em>${r?esc(ageTxt(r))+' · tap for gift ideas':'Not drawn yet, tap to spin the wheel'}</em></span></span>${r?`<span class="st"><span>${k.sent?'✅ Sent':'⏳ Not sent'}</span><span>${k.received?'📦 Received':'Not received yet'}</span></span>`:''}</button>
 <div class="getsline">${g?`🎉 Gets from <a href="#kid/${esc(g.id)}">${esc(g.name)}</a>${gs.length>1?' +'+(gs.length-1):''} · ${g.sent?'✅ sent':'⏳ not sent'} · ${g.received?'📦 received':'not received'}`:'🎉 Gets from: 🤫 not drawn yet'}</div>
 <div class="card"><h2>📮 Mail tracker</h2><div class="bigtg">
  <button class="s ${k.sent?'on':''}" ${r?'':'disabled'} onclick="toggleSent('${esc(k.id)}')"><span class="e">✅</span>${k.sent?'Sent!':'Mark sent'}<small>${esc(k.name)}'s gift to ${r?esc(r.name):'…'}</small></button>
  <button class="r ${g&&g.received?'on':''}" ${g?'':'disabled'} onclick="toggleRecv('${g?esc(g.id):''}')"><span class="e">📦</span>${g&&g.received?'Received!':'Mark received'}<small>${g?'from '+esc(g.name):'…'} to ${esc(k.name)}</small></button></div>
  <p class="muted" style="margin:10px 0 0">Keep boxes closed until opening day! 🎁</p></div>
 <div class="card"><h2>💡 Suggested gifts for ${esc(k.name)} <span class="muted" style="font-family:Fredoka;font-weight:600">(~$20)</span></h2>
  <div class="ideas">${ideas.length?ideas.map((d,i)=>ideaHTML(k,d,i)).join(''):`<div class="empty"><div class="big">🎁✨</div>No ideas yet. Add one below!</div>`}</div>
  <details class="add"><summary>＋ Add a gift idea or wish</summary>
   <label class="f">Idea or wish</label><input id="i-title" placeholder="e.g. Magna-Tiles, anything Frozen…">
   <div class="row" style="flex-wrap:nowrap"><div style="flex:1"><label class="f">Price</label><input id="i-price" inputmode="decimal" placeholder="$20"></div><div style="flex:2"><label class="f">Link (optional)</label><input id="i-url" type="url" placeholder="https://…"></div></div>
   <label class="f">Picture link (optional)</label><input id="i-image" type="url" placeholder="https://…jpg">
   <label class="f">Why it's a good fit (optional)</label><input id="i-why" placeholder="Loves building things">
   <div class="row" style="margin-top:10px"><button class="btn green" onclick="addIdea('${esc(k.id)}')">Add idea</button></div></details></div>`}
function viewLog(){return`<header class="hero"><h1 style="font-size:34px"><span class="c">Activity</span></h1><div id="sync" class="sync"></div></header><div class="card"><h2>📜 Recent changes</h2><div class="log">${(S.log||[]).map(l=>`<div><time>${new Date(l.t).toLocaleString([], {weekday:'short',month:'short',day:'numeric',hour:'numeric',minute:'2-digit'})} · ${esc(l.who)}</time>${esc(l.msg)}</div>`).join('')||'<div class="empty">No changes yet</div>'}</div></div>`}
let SPIN=false;
const SLOT=15000;
function openAt(){return S&&S.spinsOpenAt?new Date(S.spinsOpenAt).getTime():0}
function isLocked(){const o=openAt();return !!o&&Date.now()<o}
function queueIds(st=S){return (st.queue||[]).map(q=>q.id).filter(id=>st.kids.some(k=>k.id===id)&&!st.assign[id])}
function mine(){try{return JSON.parse(localStorage.getItem('wkc-mine')||'[]')}catch(e){return[]}}
function fmtTime(ts){return new Date(ts).toLocaleTimeString([], {hour:'numeric',minute:'2-digit'})}
function etaFor(id){const q=queueIds();const i=q.indexOf(id);if(i<0)return null;const base=isLocked()?openAt():Math.max(Date.now(),((S.lastShow&&S.lastShow.at)||0)+SLOT);return base+i*SLOT}
function lineMsg(id){const q=queueIds(),i=q.indexOf(id);if(i<0)return'';const t=etaFor(id);return isLocked()?`You're #${i+1} in line, spinning at ${i===0?'':'about '}${fmtTime(t)}!`:(i===0?'You\'re up next! Watch the live wheel 🎡':`You're #${i+1} in line, spinning in about ${Math.max(1,Math.round((t-Date.now())/60000))} min`)}
function joinQueue(id){const k=kid(id);if(!k)return;if(S.assign[id]){go('kid/'+id);return}
 const m=mine();if(!m.includes(id)){m.push(id);localStorage.setItem('wkc-mine',JSON.stringify(m))}
 if(queueIds().includes(id)){toast(lineMsg(id));return}
 mutate(st=>{st.queue=st.queue||[];if(!st.queue.some(q=>q.id===id)&&!st.assign[id])st.queue.push({id,t:Date.now(),who:me()})},`🙋 ${k.name} joined the draw line`);
 setTimeout(()=>{toast('🙋 '+lineMsg(id));updateSplash(true)},1600)}
function queueList(){const q=queueIds(),m=mine();if(!q.length)return`<div class="qempty">Nobody in line yet. Be first! 🙋</div>`;
 return`<ol class="qlist">${q.map((id,i)=>{const k=kid(id);return`<li class="${m.includes(id)?'me':''}"><span class="qn">${i+1}</span>${av(k)}<b>${esc(k.name)}</b>${m.includes(id)?'<em>you</em>':''}${!isLocked()&&i===0?'<em class="nx">up next</em>':''}</li>`}).join('')}</ol>`}
function drawCard(){const n=S.kids.length,left=Draw.undrawn(S);const done=n-left.length;const q=queueIds();
 if(!left.length)return`<div class="card drawcard"><h2>🎉 Everyone has drawn!</h2><p class="muted" style="margin:0">All ${n} kids know who they're giving to. Tap a kid to see.</p></div>`;
 const o=openAt(),locked=isLocked();
 return`<div class="card drawcard"><h2>${locked?'⏳ The big draw':'🔴 Live draw'}</h2>
 <p class="muted" style="margin:-4px 0 10px">${locked?`Starts at <b>${fmtTime(o)}</b>. Tap your kid to join the line, the wheel spins for everyone in order!`:`${done} of ${n} drawn. Tap your kid to join the line, the wheel spins live in order.`}</p>
 ${locked?`<button class="btn small" style="margin-bottom:10px" onclick="sessionStorage.removeItem('wkc-peek');updateSplash(true)">⏰ Show countdown</button>`:''}

function clearLog(){if(!isAdmin())return;if(!confirm('Clear the whole activity log?'))return;mutate(st=>{st.log=[]},'🧹 Cleared the activity log')}
function render(){if(!S)return;const {v,id}=route();const app=$('#app');
 app.innerHTML=v==='kid'?viewKid(id):v==='draw'?viewDraw(id):v==='settings'?viewSettings():v==='list'?viewList():v==='log'?(isAdmin()?viewLog():viewPin()):viewHome();nav();renderSync();
 app.querySelectorAll('[data-sent]').forEach(b=>b.onclick=e=>{e.stopPropagation();toggleSent(b.dataset.sent)});app.querySelectorAll('[data-recv]').forEach(b=>b.onclick=e=>{e.stopPropagation();toggleRecv(b.dataset.recv)});
 if(v==='settings'&&isAdmin()){const upd=()=>{const a=$('#sw-a').value,b=$('#sw-b').value;$('#sw-prev').innerHTML=swapPreview(a,b)};$('#sw-a').onchange=upd;$('#sw-b').onchange=upd;upd()}}
// ---------- actions ----------
function setName(){const n=$('#myname').value.trim();if(n){localStorage.setItem('wkc-name',n.slice(0,40));toast('Hi '+n+'!');render()}}
function toggleSent(id){const k=kid(id),r=kid(S.assign[id]);if(!r)return;const v=!k.sent;mutate(st=>{const x=st.kids.find(q=>q.id===id);if(x)x.sent=v},`${k.name}'s gift to ${r.name}: ${v?'✅ sent':'marked not sent'}`)}
function toggleRecv(gid){const g=kid(gid),r=kid(S.assign[gid]);if(!g||!r)return;const v=!g.received;mutate(st=>{const x=st.kids.find(q=>q.id===gid);if(x){x.received=v;if(v)x.sent=true}},`${r.name} ${v?'📦 received':'marked not received'} the gift from ${g.name}`);
 if(v){const n=daysTo(S.openingDate);setTimeout(()=>toast(n!==null&&n<=0?'📦 Received! It\'s opening day, go open it! 🎉':'📦 Received! Keep it closed until opening day! 🎁'),1200)}}
function setOpening(clear){if(!isAdmin())return go('settings');const v=clear?'':($('#odate').value||'');if(!clear&&!v){toast('Pick a date');return}mutate(st=>{st.openingDate=v},v?`Set opening day to ${fmtDate(v)}`:'Cleared the opening day')}
function saveField(id,f){const val=$('#'+f).value.slice(0,2000);const k=kid(id);mutate(st=>{const x=st.kids.find(q=>q.id===id);if(x)x[f]=val},`Updated ${k.name}'s ${f==='note'?'gift note':'wish list'}`)}
function addIdea(id){const d={title:$('#i-title').value.trim().slice(0,140),price:$('#i-price').value.trim().slice(0,20),url:$('#i-url').value.trim().slice(0,600),image:$('#i-image').value.trim().slice(0,600),why:$('#i-why').value.trim().slice(0,300),by:me(),addedBy:me()||'Family'};if(!d.title){toast('Give the idea a name');return}
 if(d.url&&!/^https?:\/\//.test(d.url))d.url='https://'+d.url;if(d.image&&!/^https?:\/\//.test(d.image))d.image='';
 mutate(st=>{const x=st.kids.find(q=>q.id===id);if(x){x.giftIdeas=x.giftIdeas||[];x.giftIdeas.push(d)}},`Added gift idea for ${kid(id).name}: ${d.title}`)}
function delIdea(id,i){if(!isAdmin())return go('settings');const k=kid(id),d=k.giftIdeas[i];if(!d||!confirm(`Remove "${d.title}"?`))return;mutate(st=>{const x=st.kids.find(q=>q.id===id);if(x&&x.giftIdeas){const j=x.giftIdeas.findIndex(z=>z.title===d.title&&z.url===d.url);if(j>-1)x.giftIdeas.splice(j,1)}},`Removed gift idea for ${k.name}: ${d.title}`)}
function swapPreview(a,b){if(!a||!b||a===b)return'Pick two different kids.';const ra=S.assign[b],rb=S.assign[a];const issues=[];if(ra===a)issues.push(`${kid(a).name} would get themself`);if(rb===b)issues.push(`${kid(b).name} would get themself`);if(ra&&excluded(a,ra))issues.push(`${kid(a).name} & ${kid(ra).name} are siblings`);if(rb&&excluded(b,rb))issues.push(`${kid(b).name} & ${kid(rb).name} are siblings`);
 return`After: <b>${esc(kid(a).name)} → ${esc((kid(ra)||{name:'nobody'}).name)}</b>, <b>${esc(kid(b).name)} → ${esc((kid(rb)||{name:'nobody'}).name)}</b>${issues.length?`<div style="color:#b45309;margin-top:4px">⚠️ ${issues.map(esc).join('; ')}</div>`:''}`}
function doSwap(){if(!isAdmin())return go('settings');const a=$('#sw-a').value,b=$('#sw-b').value;if(!a||!b||a===b){toast('Pick two different kids');return}
 const ra=S.assign[b],rb=S.assign[a];const bad=(ra&&excluded(a,ra))||(rb&&excluded(b,rb));if(bad&&!confirm('This breaks a sibling rule or has someone buying for themself. Do it anyway?'))return;
 mutate(st=>{const x=st.assign[a],y=st.assign[b];st.assign[a]=y;st.assign[b]=x;[a,b].forEach(id=>{const k=st.kids.find(q=>q.id===id);if(k){k.sent=false;k.received=false;k.note=''}})},`Swapped: ${kid(a).name} now buys for ${(kid(ra)||{name:'nobody'}).name}, ${kid(b).name} for ${(kid(rb)||{name:'nobody'}).name}`)}
function reassign(id,nr){if(!isAdmin())return go('settings');if(!nr||nr===S.assign[id])return;if(nr===id){toast("Can't buy for themself");return}const other=giverOf(nr).find(g=>g!==id);const old=S.assign[id];
 const sim=JSON.parse(JSON.stringify(S));sim.assign[id]=nr;if(other)sim.assign[other]=old;const before=problems().length,after=problems(sim);
 let msg=`${kid(id).name} will buy for ${kid(nr).name}`+(other?`, and ${kid(other).name} takes ${(kid(old)||{name:'nobody'}).name}.`:'.');
 if(after.length)msg+=`\n\n⚠️ Heads up:\n• `+after.join('\n• ');
 if(!confirm(msg+'\n\nGo ahead?'))return;
 mutate(st=>{const o=Object.keys(st.assign).find(g=>g!==id&&st.assign[g]===nr);const prev=st.assign[id];st.assign[id]=nr;if(o)st.assign[o]=prev;[id,o].forEach(q=>{const k=st.kids.find(z=>z.id===q);if(k){k.sent=false;k.received=false;k.note=''}})},`${kid(id).name} now buys for ${kid(nr).name}`+(other?` (${kid(other).name} now buys for ${(kid(old)||{name:'nobody'}).name})`:''))}
async function redraw(){if(!isAdmin())return go('settings');if(!confirm('Re-draw EVERYONE at once? This replaces all draws and resets Sent/Received & notes.'))return;const a=makeDraw();if(!a){toast("Can't find a draw with these rules");return}
 mutate(st=>{st.assign=a;st.queue=[];st.lastShow=null;st.kids.forEach(k=>{k.sent=false;k.received=false;k.note=''})},'Re-drew everyone (new random gift circle)')}
function editKid(id){if(!isAdmin())return go('settings');const n=$('#en-'+id).value.trim().slice(0,40),a=$('#ea-'+id).value.trim().slice(0,12);if(!n){toast('Name needed');return}const old=kid(id).name;mutate(st=>{const k=st.kids.find(q=>q.id===id);if(k){k.name=n;k.age=a}},`Edited ${old}${old!==n?' → '+n:''} (age ${a})`)}
function removeKid(id){if(!isAdmin())return go('settings');const k=kid(id);if(!confirm(`Remove ${k.name} from the exchange? We'll close the gap so the circle still works.`))return;
 mutate(st=>{const g=Object.keys(st.assign).find(x=>st.assign[x]===id);const r=st.assign[id];delete st.assign[id];if(g&&r&&r!==g)st.assign[g]=r;else if(g)delete st.assign[g];st.kids=st.kids.filter(q=>q.id!==id);st.exclusions=st.exclusions.map(gr=>gr.filter(x=>x!==id)).filter(gr=>gr.length>1)},`Removed ${k.name}`);go('')}
function addKid(){if(!isAdmin())return go('settings');const n=$('#n-name').value.trim().slice(0,40),a=$('#n-age').value.trim().slice(0,12);if(!n){toast('Name needed');return}
 let id=n.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'kid';while(kid(id))id+='-2';
 mutate(st=>{st.kids.push({id,name:n,age:a,sent:false,received:false,note:'',wishlist:'',giftIdeas:[]});
  // splice into the circle: find a giver g where g->id and id->r are allowed
  const allDrawn=st.kids.every(q=>q.id===id||st.assign[q.id]);if(allDrawn){const gs=shuffle(Object.keys(st.assign));const g=gs.find(x=>!excluded(x,id)&&!excluded(id,st.assign[x]));if(g){st.assign[id]=st.assign[g];st.assign[g]=id}}},`Added ${n}${a?' ('+a+')':''}`);toast('Added '+n)}
function addGroup(){if(!isAdmin())return go('settings');const ids=[...document.querySelectorAll('.gchk:checked')].map(c=>c.value);if(ids.length<2){toast('Pick at least 2 kids');return}
 mutate(st=>{st.exclusions.push(ids)},`Added sibling rule: ${ids.map(i=>kid(i).name).join(', ')}`)}
function delGroup(i){if(!isAdmin())return go('settings');const g=S.exclusions[i];if(!confirm('Remove this sibling rule?'))return;mutate(st=>{st.exclusions=st.exclusions.filter(x=>JSON.stringify(x)!==JSON.stringify(g))},`Removed sibling rule: ${g.map(i=>(kid(i)||{name:i}).name).join(', ')}`)}
// ---------- snow ----------
(()=>{const c=$('#snow'),x=c.getContext('2d');let W,H,f=[];const R=()=>{W=c.width=innerWidth;H=c.height=innerHeight};R();addEventListener('resize',R);
 for(let i=0;i<60;i++)f.push({x:Math.random()*W,y:Math.random()*H,r:Math.random()*2.2+.6,s:Math.random()*.6+.25,d:Math.random()*6.28});
 if(matchMedia('(prefers-reduced-motion: reduce)').matches){return}
 (function t(){x.clearRect(0,0,W,H);x.fillStyle='rgba(255,255,255,.75)';for(const p of f){p.y+=p.s;p.d+=.01;p.x+=Math.sin(p.d)*.3;if(p.y>H){p.y=-5;p.x=Math.random()*W}x.beginPath();x.arc(p.x,p.y,p.r,0,6.28);x.fill()}requestAnimationFrame(t)})()})();
load();
</script>
